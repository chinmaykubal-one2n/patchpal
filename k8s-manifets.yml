apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
        - args:
            - /bin/sh
            - -c
            - while ;

          name: nginx-app
          image: nginx:1.14.2
          ports:
            - containerPort: 80
          securityContext:
            privileged: false
            readOnlyRootFilesystem: true